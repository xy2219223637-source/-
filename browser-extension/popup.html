<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>恩睿视频采集助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="mark">ER</div>
        <div>
          <h1>视频采集助手</h1>
          <p id="platform">正在读取当前页面</p>
        </div>
      </header>
      <section>
        <div id="page-title" class="page-title">当前页面</div>
        <div id="page-url" class="page-url"></div>
      </section>
      <label>
        <span>应用地址</span>
        <input id="app-base" type="url" spellcheck="false" />
      </label>
      <label class="toggle-row">
        <input id="auto-close" type="checkbox" />
        <span>成功后关闭临时标签页</span>
      </label>
      <button id="collect" type="button">采集当前视频</button>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
