services:
  backend:
    image: enrui-ai-commerce-agent-backend:${DEPLOY_IMAGE_TAG:-latest}
    build:
      context: ./backend
    env_file:
      - ${APP_ENV_FILE:-./backend/.env}
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    image: enrui-ai-commerce-agent-frontend:${DEPLOY_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
